<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Expenses</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <a href="edit.html"><button>Edit Data</button></a>
  <div class="periods" id="periods">
    <label><input type="radio" name="period" value="daily"> Daily</label>
    <label><input type="radio" name="period" value="weekly"> Weekly</label>
    <label><input type="radio" name="period" value="biweekly"> Biweekly</label>
    <label><input type="radio" name="period" value="monthly"> Monthly</label>
    <label><input type="radio" name="period" value="annual"> Annual</label>
  </div>
  <div class="image">
    <div class="bars" id="bars"></div>
    <div class="ring-chart">
      <div class="center">
        <div class="large" id="consumption-label"></div>
        <div class="vlarge" id="total"></div>
      </div>
      <div class="center" id="ring"></div>
      <div class="legend" id="legend"></div>
    </div>
  </div>
</div>
<script src="common.js"></script>
<script src="main.js"></script>
</body>
</html>
